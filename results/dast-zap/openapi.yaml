openapi: 3.0.0
info: {title: target, version: "1"}
servers: [{url: http://host.docker.internal:5001}]
paths:
  /search:
    get:
      parameters: [{name: q, in: query, schema: {type: string, default: alice}}]
      responses: {"200": {description: ok}}
  /greet:
    get:
      parameters: [{name: name, in: query, schema: {type: string, default: bob}}]
      responses: {"200": {description: ok}}
  /comments:
    get:
      responses: {"200": {description: ok}}
    post:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                author: {type: string, default: zap}
                text: {type: string, default: hello}
      responses: {"201": {description: ok}}
  /login:
    post:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username: {type: string, default: alice}
                password: {type: string, default: x}
      responses: {"200": {description: ok}}